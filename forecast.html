<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>24시간 시간별 예보 | 모두의 바다</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0;
        background: #0f172a;
        font-family: 'Gowun Dodum', 'Manrope', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        color: #e8eefb;
        min-height: 100vh;
        min-height: 100dvh;
    }
    .fc-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        position: sticky;
        top: 0;
        background: #0f172a;
        z-index: 10;
    }
    .fc-back {
        color: #94a3b8;
        text-decoration: none;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border-radius: 8px;
        transition: background 0.2s;
    }
    .fc-back:hover { background: rgba(255,255,255,0.06); color: #e8eefb; }
    .fc-topbar-title { font-size: 18px; font-weight: 800; color: #e8eefb; }

    .fc-wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }

    .fc-spot-header { margin-bottom: 16px; }
    .fc-spot-name { font-size: 28px; font-weight: 800; color: #f8fafc; margin: 0 0 4px; }
    .fc-spot-sub { font-size: 15px; color: #8ba3cc; }

    .hf-card {
        background: #0d1b33;
        border-radius: 16px;
        padding: 20px 18px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .hf-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap: wrap; gap: 4px; }
    .hf-title { color:#e8eefb; font-size:21px; font-weight:800; }
    .hf-updated { color:#8ba3cc; font-size:14px; }
    .hf-location { color:#8ba3cc; font-size:15px; margin-bottom:16px; }

    .hf-warning-box { background:#3a2a10; border:0.5px solid #7a5a1c; border-radius:10px; padding:12px 14px; margin-bottom:18px; }
    .hf-warning-title { color:#f5c86a; font-size:17px; font-weight:700; margin-bottom:4px; }
    .hf-warning-desc { color:#d6c19a; font-size:15px; line-height:1.6; }
    .hf-warning-box.ok { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.35); }
    .hf-warning-box.ok .hf-warning-title { color:#34d399; }
    .hf-warning-box.ok .hf-warning-desc { color:#a7f3d0; }

    .hf-chart-heading { color:#f8fafc; font-size:19px; font-weight:800; margin: 16px 0 8px; }
    .hf-legend-row { display:flex; align-items:center; gap:12px; margin-top:8px; margin-bottom:4px; flex-wrap:wrap; }
    .hf-legend-title { color:#e8eefb; font-size:17px; font-weight:700; }
    .hf-legend-item { display:flex; align-items:center; gap:5px; color:#9fb4d6; font-size:14px; }
    .hf-dot { width:10px; height:10px; border-radius:2px; display:inline-block; flex-shrink: 0; }
    .hf-line-swatch { width:16px; height:2.5px; background:#3987e5; display:inline-block; flex-shrink:0; }

    .hf-subtitle { color:#e8eefb; font-size:17px; font-weight:700; margin:14px 0 6px; }

    /* [신규] 시간별 데이터 - 가로 테이블 형태 (물때앱 스타일 참고) */
    .hf-table-wrap {
        margin-top: 18px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 12px;
        border: 0.5px solid #24375a;
    }
    .hf-table { width: 100%; min-width: 560px; border-collapse: collapse; }
    .hf-table th {
        background: #142a4a;
        color: #9fb4d6;
        font-size: 14px;
        font-weight: 700;
        padding: 11px 6px;
        text-align: center;
        white-space: nowrap;
        position: sticky;
        top: 0;
    }
    .hf-table td {
        padding: 13px 6px;
        text-align: center;
        font-size: 16px;
        color: #e8eefb;
        border-top: 1px solid rgba(255,255,255,0.06);
        white-space: nowrap;
    }
    .hf-table tr.now td { background: rgba(93, 163, 245, 0.1); }
    .hf-table td.hf-td-hour { font-weight: 800; color: #f8fafc; }
    .hf-table tr.now td.hf-td-hour { color: #5da3f5; }
    .hf-table td.hf-td-wind-speed { font-weight: 800; }
    .hf-td-dir-arrow { display: inline-block; font-size: 17px; color: #5da3f5; }
    .hf-td-dir-text { font-size: 13px; color: #9fb4d6; display: block; margin-top: 2px; }
    .hf-td-weather { font-size: 21px; }
    .hf-td-temp { font-size: 12.5px; color: #9fb4d6; display: block; margin-top: 2px; }
    .hf-td-wave-row { display: flex; align-items: center; justify-content: center; gap: 5px; }

    .fc-loading, .fc-error {
        text-align: center;
        padding: 40px 20px;
        color: #8ba3cc;
        font-size: 16px;
        line-height: 1.6;
    }
    .fc-error b { color: #fca5a5; display: block; margin-bottom: 6px; font-size: 17px; }

    /* [신규] 일자별 예보 - 세로 리스트 */
    .hf-daily-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .hf-daily-row {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 0.5px solid #24375a;
        border-radius: 10px;
        padding: 11px 14px;
    }
    .hf-daily-row.today { border: 1.5px solid #5da3f5; background: rgba(93, 163, 245, 0.07); }
    .hf-daily-date { color: #8ba3cc; font-size: 15px; font-weight: 700; width: 68px; flex-shrink: 0; }
    .hf-daily-row.today .hf-daily-date { color: #5da3f5; }
    .hf-daily-icon { font-size: 22px; flex-shrink: 0; }
    .hf-daily-stats { flex: 1; display: flex; justify-content: flex-end; gap: 16px; }
    .hf-daily-wave { color: #e8eefb; font-size: 15.5px; font-weight: 800; }
    .hf-daily-wind { color: #8ba3cc; font-size: 15.5px; }
    .hf-daily-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

    <div class="fc-topbar">
        <a class="fc-back" href="javascript:void(0)" onclick="window.close(); if(!window.closed){history.back();}">← 지도로 돌아가기</a>
        <span class="fc-topbar-title">24시간 시간별 예보</span>
    </div>

    <div class="fc-wrap">
        <div class="fc-spot-header">
            <h1 class="fc-spot-name" id="fc-spot-name">-</h1>
            <p class="fc-spot-sub" id="fc-spot-sub">시간대별 파고·풍속을 확인하고 입수 시간대를 계획하세요.</p>
        </div>

        <div id="fc-loading" class="fc-loading">⏳ 예보 데이터를 불러오는 중...</div>
        <div id="fc-error" class="fc-error" style="display:none;"></div>

        <div class="hf-card" id="hf-card" style="display:none;">
            <div class="hf-header-row">
                <span class="hf-title">📈 시간별 예보</span>
                <span class="hf-updated" id="hf-updated">-</span>
            </div>
            <div class="hf-location" id="hf-location">-</div>

            <div class="hf-warning-box" id="hf-warning-box" style="display:none;">
                <div class="hf-warning-title" id="hf-warning-title"></div>
                <div class="hf-warning-desc" id="hf-warning-desc"></div>
            </div>

            <div class="hf-chart-heading">📊 파고 · 풍속 그래프</div>
            <svg id="hf-combined-svg" width="100%" viewBox="0 0 660 158" role="img" aria-label="시간별 파고·풍속 그래프"></svg>

            <div class="hf-legend-row">
                <span class="hf-legend-title">파고</span>
                <span class="hf-legend-item"><span class="hf-dot" style="background:#1baf7a"></span>안전 0.7m 미만</span>
                <span class="hf-legend-item"><span class="hf-dot" style="background:#eda100"></span>주의 0.7–1.2m</span>
                <span class="hf-legend-item"><span class="hf-dot" style="background:#e34948"></span>위험 1.2m 이상</span>
                <span class="hf-legend-item"><span class="hf-line-swatch"></span>풍속(m/s)</span>
            </div>

            <div class="hf-table-wrap">
                <table class="hf-table">
                    <thead>
                        <tr>
                            <th>시간</th>
                            <th>풍향</th>
                            <th>풍속</th>
                            <th>날씨</th>
                            <th>수온</th>
                            <th>파고</th>
                        </tr>
                    </thead>
                    <tbody id="hf-table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="hf-card" id="hf-daily-card" style="display:none; margin-top:16px;">
            <div class="hf-header-row">
                <span class="hf-title">🗓️ 일자별 예보</span>
                <span class="hf-updated">03~21시 최댓값 기준</span>
            </div>
            <div class="hf-daily-list" id="hf-daily-list"></div>
        </div>
    </div>

<script>
    // [신규] URL 파라미터에서 스팟 정보 읽기 (오션맵 마커 클릭 패널에서 링크로 넘어옴)
    const params = new URLSearchParams(window.location.search);
    const spotName = params.get('name') || '';
    const lat = parseFloat(params.get('lat'));
    const lng = parseFloat(params.get('lng'));

    // 입수 활동 시간대만 표시 (새벽 03시 ~ 밤 21시) - 야간엔 입수하지 않으므로 제외
    const DAY_START_HOUR = 3;
    const DAY_END_HOUR = 21;

    // 그래프 좌/우 축 고정 스케일
    const WAVE_AXIS_MAX = 3;   // 좌측축(파고, m)
    const WIND_AXIS_MAX = 10;  // 우측축(풍속, m/s)

    document.getElementById('fc-spot-name').innerText = spotName || '스팟 정보 없음';

    if (isNaN(lat) || isNaN(lng)) {
        showError('스팟 좌표 정보가 없습니다.', '오션맵에서 마커를 클릭한 뒤 "파고 풍속 예보" 버튼으로 다시 들어와주세요.');
    } else {
        loadForecast(lat, lng, spotName);
    }

    function showError(title, desc) {
        document.getElementById('fc-loading').style.display = 'none';
        const errEl = document.getElementById('fc-error');
        errEl.style.display = 'block';
        errEl.innerHTML = `<b>${title}</b>${desc}`;
    }

    // 파고 구간별 색상 - 안전(초록) / 주의(주황) / 위험(빨강)
    function waveSeverityColor(h) {
        if (h >= 1.2) return '#e34948';
        if (h >= 0.7) return '#eda100';
        return '#1baf7a';
    }

    // 풍향 각도(deg, "바람이 불어오는 방향") -> 8방위 한글
    function deg2dir8(deg) {
        if (deg === null || deg === undefined || isNaN(deg)) return '-';
        const dirs = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
        const idx = Math.round((deg % 360) / 45) % 8;
        return dirs[idx];
    }

    // [신규] 시간별(hourly) 배열에서, 날짜별로 활동 시간대(03~21시)에 속하는 값들만 골라 최댓값을 구함.
    // times: ISO 문자열 배열, values: 같은 길이의 숫자 배열, dates: 결과에 포함할 날짜("YYYY-MM-DD") 목록
    function computeDaytimeMaxByDate(times, values, dates) {
        const result = {};
        dates.forEach(d => { result[d] = null; });
        times.forEach((t, i) => {
            const dateStr = t.slice(0, 10);
            if (!(dateStr in result)) return;
            const hr = new Date(t).getHours();
            if (hr < DAY_START_HOUR || hr > DAY_END_HOUR) return;
            const v = values[i];
            if (v === null || v === undefined || isNaN(v)) return;
            if (result[dateStr] === null || v > result[dateStr]) result[dateStr] = v;
        });
        return result;
    }

    async function loadForecast(lat, lng, name) {
        try {
            // [신규] Open-Meteo 시간별(hourly) 예보 - 풍속+풍향+날씨코드+기온, 파고+수온(해수면온도), 한국 시간대 기준
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=wind_speed_10m,wind_direction_10m,weathercode,temperature_2m&daily=weathercode,wind_speed_10m_max&wind_speed_unit=ms&forecast_days=7&timezone=Asia%2FSeoul`;
            const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&hourly=wave_height,sea_surface_temperature&daily=wave_height_max&forecast_days=7&timezone=Asia%2FSeoul`;

            const [weatherRes, marineRes] = await Promise.all([
                fetch(weatherUrl),
                fetch(marineUrl)
            ]);

            if (!weatherRes.ok || !marineRes.ok) throw new Error('예보 API 응답 실패');

            const weatherData = await weatherRes.json();
            const marineData = await marineRes.json();
            console.log('[시간별 풍속·풍향·날씨·기온 예보 응답]', weatherData);
            console.log('[시간별 파고·수온 예보 응답]', marineData);

            const windTimes = weatherData?.hourly?.time || [];
            const windArrRaw = weatherData?.hourly?.wind_speed_10m || [];
            const windDirArrRaw = weatherData?.hourly?.wind_direction_10m || [];
            const weatherCodeArrRaw = weatherData?.hourly?.weathercode || [];
            const airTempArrRaw = weatherData?.hourly?.temperature_2m || [];
            const waveTimes = marineData?.hourly?.time || [];
            const waveArrRaw = marineData?.hourly?.wave_height || [];
            const tempArrRaw = marineData?.hourly?.sea_surface_temperature || [];

            if (windTimes.length === 0 || waveTimes.length === 0) {
                throw new Error('시간별 데이터가 비어있습니다');
            }

            // 두 응답의 시간 배열 길이가 다를 수 있어 짧은 쪽 기준으로 맞추고,
            // 오늘 하루(첫 24개) 중 활동 시간대(03~21시)만 남김
            const nFull = Math.min(windTimes.length, waveTimes.length, 24);
            const hours = [];
            const waveArr = [];
            const windArr = [];
            const windDirArr = [];
            const tempArr = [];
            const weatherCodeArr = [];
            const airTempArr = [];
            for (let i = 0; i < nFull; i++) {
                const hr = new Date(windTimes[i]).getHours();
                if (hr < DAY_START_HOUR || hr > DAY_END_HOUR) continue;
                hours.push(hr);
                windArr.push(windArrRaw[i] ?? 0);
                windDirArr.push(windDirArrRaw[i] ?? null);
                weatherCodeArr.push(weatherCodeArrRaw[i] ?? null);
                airTempArr.push(airTempArrRaw[i] ?? null);
                waveArr.push(waveArrRaw[i] ?? 0);
                tempArr.push(tempArrRaw[i] ?? null);
            }

            document.getElementById('fc-loading').style.display = 'none';
            document.getElementById('hf-card').style.display = 'block';
            renderHourlyForecast(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, name);

            // [신규] 일자별(daily) 예보 - 실패해도 시간별 예보 화면에는 영향 없도록 별도 try
            try {
                const dailyDates = weatherData?.daily?.time || [];
                const dailyCodes = weatherData?.daily?.weathercode || [];
                if (dailyDates.length > 0) {
                    // [수정] Open-Meteo의 daily 최댓값은 00~24시 전체 기준이라 야간 값이 섞여있음.
                    // 시간별 예보와 동일하게 03~21시(활동 시간대)만 반영해서 다시 계산합니다.
                    const daytimeWaveMax = computeDaytimeMaxByDate(waveTimes, waveArrRaw, dailyDates);
                    const daytimeWindMax = computeDaytimeMaxByDate(windTimes, windArrRaw, dailyDates);
                    renderDailyForecast(dailyDates, dailyCodes, daytimeWindMax, daytimeWaveMax);
                }
            } catch (dailyErr) {
                console.error('일자별 예보 렌더링 실패:', dailyErr);
            }
        } catch (err) {
            console.error('예보 데이터 로드 실패:', err);
            showError('예보 데이터를 불러오지 못했습니다.', '잠시 후 다시 시도해주세요. 문제가 반복되면 오션맵으로 돌아가 다시 접속해보세요.');
        }
    }

    function renderHourlyForecast(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, spotName) {
        const now = new Date();
        const nowHour = now.getHours();
        const nowIdx = hours.findIndex(h => h === nowHour); // 활동시간대 밖이면 -1 (지금 표시 없음)

        document.getElementById('hf-updated').innerText =
            `Open-Meteo 예보 · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 기준`;
        document.getElementById('hf-location').innerText =
            spotName ? `${spotName} 인근 해상` : '선택한 위치 인근 해상';

        renderWarningBox(hours, waveArr, windArr, nowIdx);
        renderCombinedChart(hours, waveArr, windArr, nowIdx);
        renderHourlyTable(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, nowIdx);
    }

    // [수정] "접속한 시간(지금)" 기준으로 "앞으로"의 파고·풍속만 안내합니다.
    // 이미 지나간 시간대는 지금 와서 피할 수 없으니 안내 대상에서 제외하고,
    // 문구도 "지금부터"로 범위를 명확히 해서 오해가 없게 했습니다.
    function renderWarningBox(hours, waveArr, windArr, nowIdx) {
        const warnBox = document.getElementById('hf-warning-box');
        const startScanIdx = nowIdx >= 0 ? nowIdx : 0;

        const waveDangerIdxs = [];
        const windDangerIdxs = [];
        for (let i = startScanIdx; i < hours.length; i++) {
            if (waveArr[i] >= 1.2) waveDangerIdxs.push(i);
            if (windArr[i] >= 6.0) windDangerIdxs.push(i);
        }

        warnBox.style.display = 'block';

        if (waveDangerIdxs.length === 0 && windDangerIdxs.length === 0) {
            warnBox.className = 'hf-warning-box ok';
            document.getElementById('hf-warning-title').innerText = '지금부터는 편안한 바다가 예상됩니다';
            document.getElementById('hf-warning-desc').innerText = '다만 현장 기상 변화와 안전요원 안내를 함께 확인하세요.';
            return;
        }

        warnBox.className = 'hf-warning-box';
        const parts = [];
        if (waveDangerIdxs.length > 0) {
            const startH = hours[waveDangerIdxs[0]];
            const endH = hours[waveDangerIdxs[waveDangerIdxs.length - 1]];
            const maxW = Math.max(...waveDangerIdxs.map(i => waveArr[i])).toFixed(1);
            parts.push(`파고 ${startH}~${endH}시 ${maxW}m 이상`);
        }
        if (windDangerIdxs.length > 0) {
            const startH = hours[windDangerIdxs[0]];
            const endH = hours[windDangerIdxs[windDangerIdxs.length - 1]];
            const maxWd = Math.max(...windDangerIdxs.map(i => windArr[i])).toFixed(1);
            parts.push(`풍속 ${startH}~${endH}시 ${maxWd}m/s 이상`);
        }
        document.getElementById('hf-warning-title').innerText = `지금부터 ${parts.join(' · ')} 예보`;
        document.getElementById('hf-warning-desc').innerText = '해당 시간대 전후로는 입수를 피하고, 안전한 시간대를 골라 계획하세요.';
    }

    // [신규] 파고(막대, 좌측축) + 풍속(선그래프, 우측축) - 두 축을 각각 표시
    function renderCombinedChart(hours, waveArr, windArr, nowIdx) {
        const left = 46, right = 590, baseY = 118, topY = 24;
        const n = hours.length;
        if (n === 0) { document.getElementById('hf-combined-svg').innerHTML = ''; return; }

        const usablePx = baseY - topY;
        const slotW = (right - left) / n;
        const barW = Math.min(18, slotW * 0.6);

        // 좌측축(파고 0~3m) / 우측축(풍속 0~10m/s) 눈금
        const leftTicks = [0, 0.5, 1, 1.5, 2, 2.5, 3];
        const rightTicks = [0, 2, 4, 6, 8, 10];

        const gridLines = leftTicks.map(v => {
            const y = baseY - (v / WAVE_AXIS_MAX) * usablePx;
            return `<line x1="${left}" y1="${y.toFixed(1)}" x2="${right}" y2="${y.toFixed(1)}" stroke="${v === 0 ? '#2a3d5e' : '#1e2f4a'}" stroke-width="1"/>`;
        }).join('');
        const leftAxisLabels = leftTicks.map(v => {
            const y = baseY - (v / WAVE_AXIS_MAX) * usablePx;
            return `<text x="${left - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="#6d84a8" font-size="12.5">${v}</text>`;
        }).join('');
        const rightAxisLabels = rightTicks.map(v => {
            const y = baseY - (v / WIND_AXIS_MAX) * usablePx;
            return `<text x="${right + 10}" y="${(y + 4).toFixed(1)}" text-anchor="start" fill="#6d84a8" font-size="12.5">${v}</text>`;
        }).join('');
        const axisTitles = `
            <text x="${left}" y="14" fill="#9fb4d6" font-size="12.5" font-weight="700">파고(m)</text>
            <text x="${right}" y="14" text-anchor="end" fill="#9fb4d6" font-size="12.5" font-weight="700">풍속(m/s)</text>
        `;

        // 파고 막대
        let bars = '';
        let xLabels = '';
        let nowMarker = '';
        hours.forEach((hr, i) => {
            const v = Math.min(waveArr[i], WAVE_AXIS_MAX);
            const barH = Math.max(2, (v / WAVE_AXIS_MAX) * usablePx);
            const x = left + i * slotW + (slotW - barW) / 2;
            const y = baseY - barH;
            const color = waveSeverityColor(waveArr[i]);
            bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"/>`;

            const cx = left + i * slotW + slotW / 2;
            if (hr % 3 === 0) {
                xLabels += `<text x="${cx.toFixed(1)}" y="${baseY + 20}" text-anchor="middle" fill="#6d84a8" font-size="14">${String(hr).padStart(2, '0')}</text>`;
            }
            if (i === nowIdx) {
                nowMarker = `
                    <rect x="${(x - 1).toFixed(1)}" y="${topY - 2}" width="${(barW + 2).toFixed(1)}" height="${(baseY - topY + 2).toFixed(1)}" rx="4" fill="none" stroke="#5da3f5" stroke-width="1.5"/>
                    <text x="${cx.toFixed(1)}" y="${topY - 8}" text-anchor="middle" fill="#5da3f5" font-size="14">지금</text>
                `;
            }
        });

        // 풍속 선그래프 (우측축 0~10m/s 기준)
        const pts = hours.map((hr, i) => {
            const cx = left + i * slotW + slotW / 2;
            const v = Math.min(windArr[i], WIND_AXIS_MAX);
            const cy = baseY - (v / WIND_AXIS_MAX) * usablePx;
            return { x: cx, y: cy };
        });
        const points = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const nowPoint = nowIdx >= 0 ? pts[nowIdx] : null;

        document.getElementById('hf-combined-svg').innerHTML = `
            ${gridLines}
            ${axisTitles}
            ${bars}
            <polyline fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${points}"/>
            ${nowPoint ? `<circle cx="${nowPoint.x.toFixed(1)}" cy="${nowPoint.y.toFixed(1)}" r="5" fill="#3987e5" stroke="#0d1b33" stroke-width="2"/>` : ''}
            ${nowMarker}
            ${leftAxisLabels}
            ${rightAxisLabels}
            ${xLabels}
        `;
    }

    // WMO 날씨코드 -> 이모지 (Open-Meteo 표준 weathercode)
    function weatherEmoji(code) {
        if (code === 0) return '☀️';
        if (code === 1 || code === 2) return '🌤️';
        if (code === 3) return '☁️';
        if (code === 45 || code === 48) return '🌫️';
        if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return '🌧️';
        if ([71, 73, 75, 77, 85, 86].includes(code)) return '❄️';
        if ([95, 96, 99].includes(code)) return '⛈️';
        return '🌥️';
    }

    // [신규] 3시간 간격 가로 테이블 - 시간/풍향/풍속/날씨(+기온)/수온/파고
    function renderHourlyTable(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, nowIdx) {
        const idxs = [];
        hours.forEach((hr, i) => { if (hr % 3 === 0) idxs.push(i); });

        let html = '';
        idxs.forEach(i => {
            const hr = hours[i];
            const wave = waveArr[i];
            const wind = windArr[i];
            const dirDeg = windDirArr[i];
            const dirText = deg2dir8(dirDeg);
            const temp = tempArr[i];
            const code = weatherCodeArr[i];
            const airTemp = airTempArr[i];
            const isNow = (i === nowIdx);
            const waveColor = waveSeverityColor(wave);
            // [수정] Open-Meteo 풍향은 "바람이 불어오는 방향". 화살표는 바람이 "불어가는 방향"을 가리키도록
            // 180도 더해서 표시합니다(일반적인 소비자용 날씨앱 화살표 관례) - 방위 텍스트는 "~에서 불어옴" 그대로 표기.
            const arrowRotate = (dirDeg !== null && dirDeg !== undefined) ? (dirDeg + 180) % 360 : 0;

            html += `
                <tr class="${isNow ? 'now' : ''}">
                    <td class="hf-td-hour">${String(hr).padStart(2, '0')}시${isNow ? '<br><span style="font-size:11px;">지금</span>' : ''}</td>
                    <td>
                        <span class="hf-td-dir-arrow" style="transform:rotate(${arrowRotate}deg); display:inline-block;">↑</span>
                        <span class="hf-td-dir-text">${dirText}</span>
                    </td>
                    <td class="hf-td-wind-speed">${wind.toFixed(1)}<span style="font-size:12px; color:#8ba3cc;"> m/s</span></td>
                    <td class="hf-td-weather">
                        ${code !== null ? weatherEmoji(code) : '-'}
                        <span class="hf-td-temp">${airTemp !== null ? airTemp.toFixed(0) + '°C' : '-'}</span>
                    </td>
                    <td>${temp !== null ? temp.toFixed(1) + '°C' : '-'}</td>
                    <td>
                        <div class="hf-td-wave-row">
                            <span class="hf-dot" style="background:${waveColor}; border-radius:50%;"></span>
                            <span>${wave.toFixed(1)}m</span>
                        </div>
                    </td>
                </tr>
            `;
        });
        document.getElementById('hf-table-body').innerHTML = html;
    }

    // [신규] 일자별 예보 - 세로 리스트 (가로 스크롤 카드 대신). 03~21시 기준 최댓값 사용.
    function renderDailyForecast(dates, codes, windMaxByDate, waveMaxByDate) {
        const todayStr = new Date().toISOString().slice(0, 10);
        let html = '';
        dates.forEach((d, i) => {
            const isToday = d === todayStr;
            const dt = new Date(d + 'T00:00:00');
            const md = `${dt.getMonth() + 1}/${dt.getDate()}`;
            const dow = ['일', '월', '화', '수', '목', '금', '토'][dt.getDay()];
            const wave = waveMaxByDate[d] ?? 0;
            const wind = windMaxByDate[d] ?? 0;
            const color = waveSeverityColor(wave);
            html += `
                <div class="hf-daily-row${isToday ? ' today' : ''}">
                    <span class="hf-daily-date">${isToday ? '오늘' : `${md}(${dow})`}</span>
                    <span class="hf-daily-icon">${weatherEmoji(codes[i])}</span>
                    <span class="hf-daily-stats">
                        <span class="hf-daily-wave">파고 ${wave.toFixed(1)}m</span>
                        <span class="hf-daily-wind">${wind.toFixed(1)}m/s</span>
                        <span class="hf-daily-dot" style="background:${color}"></span>
                    </span>
                </div>
            `;
        });
        document.getElementById('hf-daily-list').innerHTML = html;
        document.getElementById('hf-daily-card').style.display = 'block';
    }
</script>
