<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>24시간 시간별 예보 | 모두의 바다</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0;
        background: #0f172a;
        font-family: 'Gowun Dodum', 'Manrope', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        color: #e8eefb;
        min-height: 100vh;
        min-height: 100dvh;
    }
    .fc-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        position: sticky;
        top: 0;
        background: #0f172a;
        z-index: 10;
    }
    .fc-back {
        color: #94a3b8;
        text-decoration: none;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border-radius: 8px;
        transition: background 0.2s;
    }
    .fc-back:hover { background: rgba(255,255,255,0.06); color: #e8eefb; }
    .fc-topbar-title { font-size: 18px; font-weight: 800; color: #e8eefb; }

    .fc-wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }

    .fc-spot-header { margin-bottom: 16px; }
    .fc-spot-name { font-size: 28px; font-weight: 800; color: #f8fafc; margin: 0 0 4px; }
    .fc-spot-sub { font-size: 15px; color: #8ba3cc; }

    .hf-card {
        background: #0d1b33;
        border-radius: 16px;
        padding: 20px 18px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .hf-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap: wrap; gap: 4px; }
    .hf-title { color:#e8eefb; font-size:21px; font-weight:800; }
    .hf-updated { color:#8ba3cc; font-size:14px; }
    .hf-location { color:#8ba3cc; font-size:15px; margin-bottom:16px; }

    .hf-warning-box { background: rgba(239, 73, 72, 0.15); border:0.5px solid rgba(227, 73, 72, 0.5); border-radius:10px; padding:12px 14px; margin-bottom:18px; }
    .hf-warning-title { color:#f5a3a2; font-size:17px; font-weight:700; margin-bottom:4px; }
    .hf-warning-desc { color:#f0c5c4; font-size:15px; line-height:1.6; }
    .hf-warning-box.caution { background: rgba(237, 161, 0, 0.15); border-color: rgba(237, 161, 0, 0.5); }
    .hf-warning-box.caution .hf-warning-title { color:#f5c86a; }
    .hf-warning-box.caution .hf-warning-desc { color:#e3d3ac; }
    .hf-warning-box.ok { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.35); }
    .hf-warning-box.ok .hf-warning-title { color:#34d399; }
    .hf-warning-box.ok .hf-warning-desc { color:#a7f3d0; }

    .hf-chart-heading { color:#f8fafc; font-size:19px; font-weight:800; margin: 16px 0 8px; }
    .hf-legend-row { display:flex; align-items:center; gap:12px; margin-top:8px; margin-bottom:4px; flex-wrap:wrap; }
    .hf-legend-title { color:#e8eefb; font-size:17px; font-weight:700; }
    .hf-legend-item { display:flex; align-items:center; gap:5px; color:#9fb4d6; font-size:14px; }
    .hf-dot { width:10px; height:10px; border-radius:2px; display:inline-block; flex-shrink: 0; }
    .hf-line-swatch { width:16px; height:2.5px; background:#3987e5; display:inline-block; flex-shrink:0; }

    .hf-subtitle { color:#e8eefb; font-size:17px; font-weight:700; margin:14px 0 6px; }

    /* [신규] 시간별 데이터 - 가로 테이블 형태 (물때앱 스타일 참고) */
    .hf-table-wrap {
        margin-top: 18px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 12px;
        border: 0.5px solid #24375a;
    }
    .hf-table { width: 100%; min-width: 0; border-collapse: collapse; table-layout: fixed; }
    /* [신규] 탁도 배지 */
    .hf-turbidity-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        padding: 3px 6px;
        border-radius: 8px;
        white-space: nowrap;
    }
    .hf-turbidity-badge.tb-good { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .hf-turbidity-badge.tb-mid { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .hf-turbidity-badge.tb-bad { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .hf-table th {
        background: #142a4a;
        color: #9fb4d6;
        font-size: 13px;
        font-weight: 700;
        padding: 11px 4px;
        text-align: center;
        white-space: nowrap;
        position: sticky;
        top: 0;
    }
    .hf-table td {
        padding: 10px 3px;
        text-align: center;
        font-size: 15px;
        color: #e8eefb;
        border-top: 1px solid rgba(255,255,255,0.06);
    }
    .hf-table tr.now td { background: rgba(93, 163, 245, 0.1); }
    .hf-table td.hf-td-hour { font-weight: 800; color: #f8fafc; white-space: nowrap; }
    .hf-table tr.now td.hf-td-hour { color: #5da3f5; }
    .hf-table td.hf-td-wind-speed { font-weight: 800; }
    .hf-td-dir-arrow { display: inline-block; font-size: 16px; color: #5da3f5; }
    .hf-td-dir-text { font-size: 12px; color: #9fb4d6; }
    .hf-td-weather { font-size: 19px; }
    .hf-td-temp { font-size: 12px; color: #9fb4d6; }
    .hf-td-wave-row { display: flex; align-items: center; justify-content: center; gap: 5px; }

    /* [신규] "풍향/풍속" · "날씨/수온" 합침 열 - 위/아래로 두 값을 쌓아서 한 칸에 표시 */
    .hf-td-combo {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        line-height: 1.3;
    }
    .hf-td-combo .hf-combo-main { font-weight: 800; font-size: 15px; color: #e8eefb; white-space: nowrap; }
    .hf-td-combo .hf-combo-sub { font-size: 11.5px; color: #9fb4d6; white-space: nowrap; }

    .fc-loading, .fc-error {
        text-align: center;
        padding: 40px 20px;
        color: #8ba3cc;
        font-size: 16px;
        line-height: 1.6;
    }
    .fc-error b { color: #fca5a5; display: block; margin-bottom: 6px; font-size: 17px; }

    /* [수정] 일자별 예보 - 날짜마다 오늘 표와 동일한 시간별 표를 반복 */
    .hf-daily-list { display: flex; flex-direction: column; gap: 20px; margin-top: 8px; }
    .hf-day-group { display: flex; flex-direction: column; gap: 8px; }
    .hf-day-heading { color: #f8fafc; font-size: 16px; font-weight: 800; }
    .hf-daily-summary {
        background: rgba(93, 163, 245, 0.12);
        border: 0.5px solid rgba(93, 163, 245, 0.4);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
        color: #cfe0f5;
        font-size: 14.5px;
        line-height: 1.6;
        font-weight: 600;
    }

    /* [신규] 주간 간략 예보 - 요일별 요약 칩 가로 스크롤 */
    .hf-week-brief {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin-bottom: 20px;
        padding-bottom: 4px;
    }
    .hf-week-brief::-webkit-scrollbar { display: none; }
    .hf-week-chip {
        flex: 0 0 auto;
        width: 84px;
        background: rgba(255, 255, 255, 0.05);
        border: 0.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 10px 6px;
        text-align: center;
    }
    .hf-week-chip.is-today {
        background: rgba(93, 163, 245, 0.16);
        border-color: rgba(93, 163, 245, 0.5);
    }
    .hf-week-chip-date { color: #94a3b8; font-size: 11px; font-weight: 700; }
    .hf-week-chip-emoji { font-size: 22px; margin: 6px 0 4px; }
    .hf-week-chip-temp { color: #f8fafc; font-size: 13px; font-weight: 800; }
    .hf-week-chip-temp span { color: #8ba3cc; font-weight: 600; }
    .hf-week-chip-wind { color: #9fb4d8; font-size: 10.5px; margin-top: 4px; }
    .hf-week-chip-wave { color: #7dd3fc; font-size: 10.5px; font-weight: 700; margin-top: 2px; }
</style>
</head>
<body>

    <div class="fc-topbar">
        <a class="fc-back" href="javascript:void(0)" onclick="window.close(); if(!window.closed){history.back();}">← 지도로 돌아가기</a>
        <span class="fc-topbar-title">24시간 시간별 예보</span>
    </div>

    <div class="fc-wrap">
        <div class="fc-spot-header">
            <h1 class="fc-spot-name" id="fc-spot-name">-</h1>
            <p class="fc-spot-sub" id="fc-spot-sub">시간대별 파고·풍속을 확인하고 입수 시간대를 계획하세요.</p>
        </div>

        <div id="fc-loading" class="fc-loading">⏳ 예보 데이터를 불러오는 중...</div>
        <div id="fc-error" class="fc-error" style="display:none;"></div>

        <div class="hf-card" id="hf-card" style="display:none;">
            <div class="hf-header-row">
                <span class="hf-title">📈 시간별 예보</span>
                <span class="hf-updated" id="hf-updated">-</span>
            </div>
            <div class="hf-location" id="hf-location">-</div>

            <div class="hf-warning-box" id="hf-warning-box" style="display:none;">
                <div class="hf-warning-title" id="hf-warning-title"></div>
                <div class="hf-warning-desc" id="hf-warning-desc"></div>
            </div>

            <div class="hf-chart-heading">📊 파고 · 풍속 그래프</div>
            <svg id="hf-combined-svg" width="100%" viewBox="0 0 660 158" role="img" aria-label="시간별 파고·풍속 그래프"></svg>

            <div class="hf-legend-row">
                <span class="hf-legend-title">파고</span>
                <span class="hf-legend-item"><span class="hf-dot" style="background:#1baf7a"></span>안전 0.7m 미만</span>
                <span class="hf-legend-item"><span class="hf-dot" style="background:#eda100"></span>주의 0.7–1.2m</span>
                <span class="hf-legend-item"><span class="hf-dot" style="background:#e34948"></span>위험 1.2m 이상</span>
                <span class="hf-legend-item"><span class="hf-line-swatch"></span>풍속(m/s)</span>
            </div>

            <div class="hf-table-wrap">
                <table class="hf-table">
                    <thead>
                        <tr>
                            <th>시간</th>
                            <th>풍향/풍속</th>
                            <th>날씨/수온</th>
                            <th>파고</th>
                            <th>탁도</th>
                        </tr>
                    </thead>
                    <tbody id="hf-table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="hf-card" id="hf-daily-card" style="display:none; margin-top:16px;">
            <div class="hf-header-row">
                <span class="hf-title">🗓️ 일자별 예보</span>
            </div>
            <div class="hf-daily-summary" id="hf-daily-summary" style="display:none;"></div>
            <!-- [신규] 주간 간략 예보 - 요일별 요약 칩을 가로로 스크롤 -->
            <div class="hf-week-brief" id="hf-week-brief" style="display:none;"></div>
            <div class="hf-daily-list" id="hf-daily-list"></div>
        </div>
    </div>

<script>
    // [신규] URL 파라미터에서 스팟 정보 읽기 (오션맵 마커 클릭 패널에서 링크로 넘어옴)
    const params = new URLSearchParams(window.location.search);
    const spotName = params.get('name') || '';
    const lat = parseFloat(params.get('lat'));
    const lng = parseFloat(params.get('lng'));

    // 입수 활동 시간대만 표시 (새벽 03시 ~ 밤 21시) - 야간엔 입수하지 않으므로 제외
    const DAY_START_HOUR = 3;
    const DAY_END_HOUR = 21;

    // 그래프 좌/우 축 고정 스케일
    const WAVE_AXIS_MAX = 3;   // 좌측축(파고, m)
    const WIND_AXIS_MAX = 10;  // 우측축(풍속, m/s)

    // [신규] 탁도 - 오늘의 물때(대조기/소조기)를 하루 기준값으로 조회 (Code.gs 프록시)
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbxsFQE8atcqCH7mO8U8jM_sjRHW-Zulsh1JF_Ehpf7jL6q7SCxJPkmZWoHDYfLAIyYB/exec";
    let todayMulddaeLabel = null; // 예: "12물" - 로드 후 채워짐

    async function loadTodayMulddae() {
        try {
            const res = await fetch(`${PROXY_URL}?action=mulddae`);
            const json = await res.json();
            if (json && json.ok && json.mulddae) todayMulddaeLabel = json.mulddae;
        } catch (e) {
            console.warn('물때 조회 실패(탁도 기준값 없이 진행):', e);
        }
    }

    // [수정] 물때(하루 기준) -> 탁도 기준. 사리 구간(5~11물)은 "탁함(빨강)" 단정 대신
    //   "확인 필요(노랑)"로 완화 - 물때만으로 실제 탁도를 확신하기 어려워 오해 소지가 있었음.
    function mulddaeToTurbidityBase(m) {
        const clear = ['1물', '2물', '14물'];
        const murky = ['5물', '6물', '7물', '8물', '9물', '10물', '11물'];
        if (clear.includes(m)) return { cls: 'tb-good', text: '🟢 좋음' };
        if (murky.includes(m)) return { cls: 'tb-mid', text: '🟡 확인 필요' }; // 사리 - 조류 세져 탁해질 수 있음(단정 X)
        return { cls: 'tb-mid', text: '🟡 보통' }; // 조금, 3물, 4물, 12물, 13물 (또는 기준값 없음)
    }

    // [수정] 하천 하구 스팟인지 이름으로 판별 (강정천, 악근천 등)
    //   ⚠️ 이전엔 "용천수"/"논짓물"도 포함했었는데, 이건 잘못된 추정이었음 — 탁도에 영향을 주는 진짜 메커니즘은
    //   한라산(제주도 중앙)에 비가 오면 흙탕물이 "하천"으로 흘러들고, 그 하천이 바다와 만나는 지점에서
    //   탁류가 유입되는 것. 용천수(민물 샘)는 이 강수-유출 경로와 무관해서 판별 기준에서 제외함.
    //   ⚠️ 이름 패턴 기반 추정이라 완벽하지 않음 - 필요하면 스팟 DB에 별도 플래그를 추가하는 게 더 정확함.
    function isRiverMouthSpot(name) {
        if (!name) return false;
        return /천(\(|$)/.test(name);
    }

    // [수정] 비가 온다고 무조건 탁해지는 건 아님(제주는 비 와도 맑은 날이 많음) - 한라산 강수가
    //   하천을 통해 바다로 유입되는 "하천 인근" 스팟에서만 강수량을 반영해서 "탁류 유입 주의"로 별도 경고.
    //   그 외 스팟은 강수량과 무관하게 물때 기준만 사용.
    function computeTurbidity(precip) {
        const base = mulddaeToTurbidityBase(todayMulddaeLabel);
        if (isRiverMouthSpot(spotName) && precip >= 1.0) {
            return { cls: 'tb-bad', text: '🔴 하천 탁류 유입 주의' };
        }
        return base;
    }

    document.getElementById('fc-spot-name').innerText = spotName || '스팟 정보 없음';

    if (isNaN(lat) || isNaN(lng)) {
        showError('스팟 좌표 정보가 없습니다.', '오션맵에서 마커를 클릭한 뒤 "파고 풍속 예보" 버튼으로 다시 들어와주세요.');
    } else {
        // [수정] 탁도 계산에 물때 기준값이 필요해서, 물때 조회를 먼저 마친 뒤 시간별 예보를 불러옴
        (async function () {
            await loadTodayMulddae();
            loadForecast(lat, lng, spotName);
        })();
    }

    function showError(title, desc) {
        document.getElementById('fc-loading').style.display = 'none';
        const errEl = document.getElementById('fc-error');
        errEl.style.display = 'block';
        errEl.innerHTML = `<b>${title}</b>${desc}`;
    }

    // 파고 구간별 색상 - 안전(초록) / 주의(주황) / 위험(빨강)
    function waveSeverityColor(h) {
        if (h >= 1.2) return '#e34948';
        if (h >= 0.7) return '#eda100';
        return '#1baf7a';
    }

    // 풍향 각도(deg, "바람이 불어오는 방향") -> 8방위 한글
    function deg2dir8(deg) {
        if (deg === null || deg === undefined || isNaN(deg)) return '-';
        const dirs = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
        const idx = Math.round((deg % 360) / 45) % 8;
        return dirs[idx];
    }

    // [수정] "최댓값 하나"로 요약하지 않고, 날짜별로 03/06/09/12/15/18/21시 각각의 값을 그대로 나열하기 위해
    // 시간별(hourly) 배열 전체를 날짜별 행(row) 목록으로 묶습니다.
    function buildDailyRows(windTimes, windArrRaw, windDirArrRaw, weatherCodeArrRaw, airTempArrRaw, waveArrRaw, tempArrRaw, precipArrRaw, waveDirArrRaw, precipProbArrRaw) {
        const n = windTimes.length;
        const byDate = {};
        for (let i = 0; i < n; i++) {
            const iso = windTimes[i];
            const dateStr = iso.slice(0, 10);
            const hr = new Date(iso).getHours();
            if (hr < DAY_START_HOUR || hr > DAY_END_HOUR || hr % 3 !== 0) continue;
            if (!byDate[dateStr]) byDate[dateStr] = [];
            byDate[dateStr].push({
                hour: hr,
                wind: windArrRaw[i] ?? 0,
                windDir: windDirArrRaw[i] ?? null,
                code: weatherCodeArrRaw[i] ?? null,
                airTemp: airTempArrRaw[i] ?? null,
                wave: waveArrRaw[i] ?? 0,
                waterTemp: tempArrRaw[i] ?? null,
                precip: (precipArrRaw && precipArrRaw[i]) ?? 0,
                waveDir: (waveDirArrRaw && waveDirArrRaw[i]) ?? null,
                precipProb: (precipProbArrRaw && precipProbArrRaw[i]) ?? null // [신규] 강수확률(%)
            });
        }
        return byDate; // { 'YYYY-MM-DD': [ {hour, wind, windDir, code, airTemp, wave, waterTemp, precip, waveDir, precipProb}, ... ] }
    }

    async function loadForecast(lat, lng, name) {
        try {
            // [신규] Open-Meteo 시간별(hourly) 예보 - 풍속+풍향+날씨코드+기온, 파고+수온(해수면온도), 한국 시간대 기준
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=wind_speed_10m,wind_direction_10m,weathercode,temperature_2m,precipitation,precipitation_probability&daily=weathercode,wind_speed_10m_max&wind_speed_unit=ms&forecast_days=7&timezone=Asia%2FSeoul`;
            const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&hourly=wave_height,sea_surface_temperature,wave_direction&daily=wave_height_max&forecast_days=7&timezone=Asia%2FSeoul`;

            const [weatherRes, marineRes] = await Promise.all([
                fetch(weatherUrl),
                fetch(marineUrl)
            ]);

            if (!weatherRes.ok || !marineRes.ok) throw new Error('예보 API 응답 실패');

            const weatherData = await weatherRes.json();
            const marineData = await marineRes.json();
            console.log('[시간별 풍속·풍향·날씨·기온 예보 응답]', weatherData);
            console.log('[시간별 파고·수온 예보 응답]', marineData);

            const windTimes = weatherData?.hourly?.time || [];
            const windArrRaw = weatherData?.hourly?.wind_speed_10m || [];
            const windDirArrRaw = weatherData?.hourly?.wind_direction_10m || [];
            const weatherCodeArrRaw = weatherData?.hourly?.weathercode || [];
            const airTempArrRaw = weatherData?.hourly?.temperature_2m || [];
            const precipArrRaw = weatherData?.hourly?.precipitation || []; // [신규] 시간별 강수량(mm)
            const waveTimes = marineData?.hourly?.time || [];
            const waveArrRaw = marineData?.hourly?.wave_height || [];
            const tempArrRaw = marineData?.hourly?.sea_surface_temperature || [];
            const waveDirArrRaw = marineData?.hourly?.wave_direction || []; // [신규] 시간별 파향(deg)

            if (windTimes.length === 0 || waveTimes.length === 0) {
                throw new Error('시간별 데이터가 비어있습니다');
            }

            // 두 응답의 시간 배열 길이가 다를 수 있어 짧은 쪽 기준으로 맞추고,
            // 오늘 하루(첫 24개) 중 활동 시간대(03~21시)만 남김
            const nFull = Math.min(windTimes.length, waveTimes.length, 24);
            const hours = [];
            const waveArr = [];
            const windArr = [];
            const windDirArr = [];
            const tempArr = [];
            const weatherCodeArr = [];
            const airTempArr = [];
            const precipArr = []; // [신규]
            const waveDirArr = []; // [신규]
            for (let i = 0; i < nFull; i++) {
                const hr = new Date(windTimes[i]).getHours();
                if (hr < DAY_START_HOUR || hr > DAY_END_HOUR) continue;
                hours.push(hr);
                windArr.push(windArrRaw[i] ?? 0);
                windDirArr.push(windDirArrRaw[i] ?? null);
                weatherCodeArr.push(weatherCodeArrRaw[i] ?? null);
                airTempArr.push(airTempArrRaw[i] ?? null);
                waveArr.push(waveArrRaw[i] ?? 0);
                tempArr.push(tempArrRaw[i] ?? null);
                precipArr.push(precipArrRaw[i] ?? 0); // [신규]
                waveDirArr.push(waveDirArrRaw[i] ?? null); // [신규]
            }

            document.getElementById('fc-loading').style.display = 'none';
            document.getElementById('hf-card').style.display = 'block';
            renderHourlyForecast(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, precipArr, waveDirArr, name);

            // [신규] 일자별(daily) 예보 - 실패해도 시간별 예보 화면에는 영향 없도록 별도 try
            try {
                const dailyDates = weatherData?.daily?.time || [];
                const dailyCodes = weatherData?.daily?.weathercode || [];
                if (dailyDates.length > 0) {
                    // [수정] 최댓값 요약 대신, 03/06/09/12/15/18/21시 각 시간대 값을 날짜별로 그대로 나열합니다.
                    const rowsByDate = buildDailyRows(windTimes, windArrRaw, windDirArrRaw, weatherCodeArrRaw, airTempArrRaw, waveArrRaw, tempArrRaw, precipArrRaw, waveDirArrRaw);
                    renderWeekBrief(dailyDates, dailyCodes, rowsByDate);
                    renderDailyForecast(dailyDates, dailyCodes, rowsByDate);
                }
            } catch (dailyErr) {
                console.error('일자별 예보 렌더링 실패:', dailyErr);
            }
        } catch (err) {
            console.error('예보 데이터 로드 실패:', err);
            showError('예보 데이터를 불러오지 못했습니다.', '잠시 후 다시 시도해주세요. 문제가 반복되면 오션맵으로 돌아가 다시 접속해보세요.');
        }
    }

    function renderHourlyForecast(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, precipArr, waveDirArr, spotName) {
        const now = new Date();
        const nowHour = now.getHours();
        const nowIdx = hours.findIndex(h => h === nowHour); // 활동시간대 밖이면 -1 (지금 표시 없음)

        document.getElementById('hf-updated').innerText =
            `Open-Meteo 예보 · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 기준`;
        document.getElementById('hf-location').innerText =
            spotName ? `${spotName} 인근 해상` : '선택한 위치 인근 해상';

        renderWarningBox(hours, waveArr, windArr, nowIdx);
        renderCombinedChart(hours, waveArr, windArr, nowIdx);
        renderHourlyTable(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, precipArr, waveDirArr, nowIdx);
    }

    // [수정] "접속한 시간(지금)" 기준으로 "앞으로"의 파고·풍속만 안내합니다.
    // [수정] 기존엔 "위험" 기준(파고 1.2m·풍속 6.0m/s)만 체크해서, 실제로는 범례상 "주의" 구간
    // (파고 0.7~1.2m 등)인데도 "편안한 바다"라고 잘못 말하는 경우가 있었습니다.
    // 범례와 동일한 3단계(안전/주의/위험) 기준으로 다시 판단합니다.
    function renderWarningBox(hours, waveArr, windArr, nowIdx) {
        const warnBox = document.getElementById('hf-warning-box');
        const startScanIdx = nowIdx >= 0 ? nowIdx : 0;

        const waveDangerIdxs = [], waveCautionIdxs = [];
        const windDangerIdxs = [], windCautionIdxs = [];
        for (let i = startScanIdx; i < hours.length; i++) {
            if (waveArr[i] >= 1.2) waveDangerIdxs.push(i);
            else if (waveArr[i] >= 0.7) waveCautionIdxs.push(i);
            if (windArr[i] >= 6.0) windDangerIdxs.push(i);
            else if (windArr[i] > 3.0) windCautionIdxs.push(i);
        }

        warnBox.style.display = 'block';

        const windowText = (idxs, arr, unit) => {
            const startH = hours[idxs[0]];
            const endH = hours[idxs[idxs.length - 1]];
            const maxV = Math.max(...idxs.map(i => arr[i])).toFixed(1);
            return `${startH}~${endH}시 ${maxV}${unit} 이상`;
        };

        if (waveDangerIdxs.length > 0 || windDangerIdxs.length > 0) {
            warnBox.className = 'hf-warning-box';
            const parts = [];
            if (waveDangerIdxs.length > 0) parts.push(`파고 ${windowText(waveDangerIdxs, waveArr, 'm')}`);
            if (windDangerIdxs.length > 0) parts.push(`풍속 ${windowText(windDangerIdxs, windArr, 'm/s')}`);
            document.getElementById('hf-warning-title').innerText = `지금부터 ${parts.join(' · ')} 예보`;
            document.getElementById('hf-warning-desc').innerText = '해당 시간대 전후로는 입수를 피하고, 안전한 시간대를 골라 계획하세요.';
        } else if (waveCautionIdxs.length > 0 || windCautionIdxs.length > 0) {
            warnBox.className = 'hf-warning-box caution';
            const parts = [];
            if (waveCautionIdxs.length > 0) parts.push(`파고 ${windowText(waveCautionIdxs, waveArr, 'm')}`);
            if (windCautionIdxs.length > 0) parts.push(`풍속 ${windowText(windCautionIdxs, windArr, 'm/s')}`);
            document.getElementById('hf-warning-title').innerText = `지금부터 ${parts.join(' · ')} (주의)`;
            document.getElementById('hf-warning-desc').innerText = '위험 수준은 아니지만 다소 높아질 수 있어요. 초보자는 안전장비를 착용하고 주의하세요.';
        } else {
            warnBox.className = 'hf-warning-box ok';
            document.getElementById('hf-warning-title').innerText = '지금부터는 편안한 바다가 예상됩니다';
            document.getElementById('hf-warning-desc').innerText = '다만 현장 기상 변화와 안전요원 안내를 함께 확인하세요.';
        }
    }

    // [신규] 파고(막대, 좌측축) + 풍속(선그래프, 우측축) - 두 축을 각각 표시
    function renderCombinedChart(hours, waveArr, windArr, nowIdx) {
        const left = 46, right = 590, baseY = 118, topY = 24;
        const n = hours.length;
        if (n === 0) { document.getElementById('hf-combined-svg').innerHTML = ''; return; }

        const usablePx = baseY - topY;
        const slotW = (right - left) / n;
        const barW = Math.min(18, slotW * 0.6);

        // 좌측축(파고 0~3m) / 우측축(풍속 0~10m/s) 눈금
        const leftTicks = [0, 0.5, 1, 1.5, 2, 2.5, 3];
        const rightTicks = [0, 2, 4, 6, 8, 10];

        const gridLines = leftTicks.map(v => {
            const y = baseY - (v / WAVE_AXIS_MAX) * usablePx;
            return `<line x1="${left}" y1="${y.toFixed(1)}" x2="${right}" y2="${y.toFixed(1)}" stroke="${v === 0 ? '#2a3d5e' : '#1e2f4a'}" stroke-width="1"/>`;
        }).join('');
        const leftAxisLabels = leftTicks.map(v => {
            const y = baseY - (v / WAVE_AXIS_MAX) * usablePx;
            return `<text x="${left - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="#6d84a8" font-size="12.5">${v}</text>`;
        }).join('');
        const rightAxisLabels = rightTicks.map(v => {
            const y = baseY - (v / WIND_AXIS_MAX) * usablePx;
            return `<text x="${right + 10}" y="${(y + 4).toFixed(1)}" text-anchor="start" fill="#6d84a8" font-size="12.5">${v}</text>`;
        }).join('');
        const axisTitles = `
            <text x="${left}" y="14" fill="#9fb4d6" font-size="12.5" font-weight="700">파고(m)</text>
            <text x="${right}" y="14" text-anchor="end" fill="#9fb4d6" font-size="12.5" font-weight="700">풍속(m/s)</text>
        `;

        // 파고 막대
        let bars = '';
        let xLabels = '';
        let nowMarker = '';
        hours.forEach((hr, i) => {
            const v = Math.min(waveArr[i], WAVE_AXIS_MAX);
            const barH = Math.max(2, (v / WAVE_AXIS_MAX) * usablePx);
            const x = left + i * slotW + (slotW - barW) / 2;
            const y = baseY - barH;
            const color = waveSeverityColor(waveArr[i]);
            bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"/>`;

            const cx = left + i * slotW + slotW / 2;
            if (hr % 3 === 0) {
                xLabels += `<text x="${cx.toFixed(1)}" y="${baseY + 20}" text-anchor="middle" fill="#6d84a8" font-size="14">${String(hr).padStart(2, '0')}</text>`;
            }
            if (i === nowIdx) {
                nowMarker = `
                    <rect x="${(x - 1).toFixed(1)}" y="${topY - 2}" width="${(barW + 2).toFixed(1)}" height="${(baseY - topY + 2).toFixed(1)}" rx="4" fill="none" stroke="#5da3f5" stroke-width="1.5"/>
                    <text x="${cx.toFixed(1)}" y="${topY - 8}" text-anchor="middle" fill="#5da3f5" font-size="14">지금</text>
                `;
            }
        });

        // 풍속 선그래프 (우측축 0~10m/s 기준)
        const pts = hours.map((hr, i) => {
            const cx = left + i * slotW + slotW / 2;
            const v = Math.min(windArr[i], WIND_AXIS_MAX);
            const cy = baseY - (v / WIND_AXIS_MAX) * usablePx;
            return { x: cx, y: cy };
        });
        const points = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const nowPoint = nowIdx >= 0 ? pts[nowIdx] : null;

        document.getElementById('hf-combined-svg').innerHTML = `
            ${gridLines}
            ${axisTitles}
            ${bars}
            <polyline fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${points}"/>
            ${nowPoint ? `<circle cx="${nowPoint.x.toFixed(1)}" cy="${nowPoint.y.toFixed(1)}" r="5" fill="#3987e5" stroke="#0d1b33" stroke-width="2"/>` : ''}
            ${nowMarker}
            ${leftAxisLabels}
            ${rightAxisLabels}
            ${xLabels}
        `;
    }

    // WMO 날씨코드 -> 이모지 (Open-Meteo 표준 weathercode)
    function weatherEmoji(code) {
        if (code === 0) return '☀️';
        if (code === 1 || code === 2) return '🌤️';
        if (code === 3) return '☁️';
        if (code === 45 || code === 48) return '🌫️';
        if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return '🌧️';
        if ([71, 73, 75, 77, 85, 86].includes(code)) return '❄️';
        if ([95, 96, 99].includes(code)) return '⛈️';
        return '🌥️';
    }

    // [신규] 3시간 간격 가로 테이블 - 시간/풍향/풍속/날씨(+기온)/수온/파고
    // [신규] 표 한 줄(<tr>)을 만드는 공용 함수 - 오늘 표와 일자별 표가 같은 형식을 쓰도록 공유
    function buildTableRowHtml(hr, wave, wind, windDir, waterTemp, code, airTemp, precip, waveDir, isNow) {
        const dirText = deg2dir8(windDir);
        const waveDirText = deg2dir8(waveDir);
        const waveColor = waveSeverityColor(wave);
        // [수정] Open-Meteo 풍향/파향은 "불어오는(밀려오는) 방향". 화살표는 "불어가는(밀려가는) 방향"을 가리키도록
        // 180도 더해서 표시합니다(일반적인 소비자용 날씨앱 화살표 관례) - 방위 텍스트는 "~에서 옴" 그대로 표기.
        const arrowRotate = (windDir !== null && windDir !== undefined) ? (windDir + 180) % 360 : 0;
        const waveArrowRotate = (waveDir !== null && waveDir !== undefined) ? (waveDir + 180) % 360 : 0;

        // [신규] 강수량 - 비가 예보된 시간대에만, 날씨 이모지 옆에 숫자로 표기 (별도 열 추가 안 함)
        // 0.1mm 미만은 사실상 무의미한 값이라 표시 생략
        const precipHtml = (precip !== null && precip !== undefined && precip >= 0.1)
            ? `<span style="font-size:11.5px; color:#38bdf8; font-weight:800; margin-left:3px;">${precip.toFixed(precip < 10 ? 1 : 0)}mm</span>`
            : '';

        // [신규] 탁도 - 오늘의 물때 기준값 + 이 시간대 강수량으로 산정
        const turbidity = computeTurbidity(precip !== null && precip !== undefined ? precip : 0);

        return `
            <tr class="${isNow ? 'now' : ''}">
                <td class="hf-td-hour">${String(hr).padStart(2, '0')}시${isNow ? '<br><span style="font-size:11px;">지금</span>' : ''}</td>
                <td>
                    <div class="hf-td-combo">
                        <span class="hf-combo-main">
                            <span class="hf-td-dir-arrow" style="transform:rotate(${arrowRotate}deg); display:inline-block;">↑</span>
                            ${wind.toFixed(1)}<span style="font-size:11px; color:#8ba3cc;">m/s</span>
                        </span>
                        <span class="hf-combo-sub">${dirText}</span>
                    </div>
                </td>
                <td>
                    <div class="hf-td-combo">
                        <span class="hf-combo-main hf-td-weather">${code !== null ? weatherEmoji(code) : '-'}${airTemp !== null ? ' ' + airTemp.toFixed(0) + '°C' : ''}${precipHtml}</span>
                        <span class="hf-combo-sub" style="color:#2563eb; font-weight:800;">${waterTemp !== null ? '수온: ' + waterTemp.toFixed(1) + '°C' : '수온: -'}</span>
                    </div>
                </td>
                <td>
                    <div class="hf-td-combo">
                        <div class="hf-td-wave-row">
                            <span class="hf-dot" style="background:${waveColor}; border-radius:50%;"></span>
                            <span>${wave.toFixed(1)}m</span>
                        </div>
                        <span class="hf-combo-sub">${waveDir !== null && waveDir !== undefined ? `<span class="hf-td-dir-arrow" style="transform:rotate(${waveArrowRotate}deg); display:inline-block; font-size:11px;">↑</span> ${waveDirText}파` : ''}</span>
                    </div>
                </td>
                <td>
                    <span class="hf-turbidity-badge ${turbidity.cls}">${turbidity.text}</span>
                </td>
            </tr>
        `;
    }

    function renderHourlyTable(hours, waveArr, windArr, windDirArr, tempArr, weatherCodeArr, airTempArr, precipArr, waveDirArr, nowIdx) {
        const idxs = [];
        hours.forEach((hr, i) => { if (hr % 3 === 0) idxs.push(i); });

        let html = '';
        idxs.forEach(i => {
            html += buildTableRowHtml(
                hours[i], waveArr[i], windArr[i], windDirArr[i],
                tempArr[i], weatherCodeArr[i], airTempArr[i], precipArr[i], waveDirArr ? waveDirArr[i] : null, i === nowIdx
            );
        });
        document.getElementById('hf-table-body').innerHTML = html;
    }

    // [신규] 주간 간략 예보 - 요일별 요약 칩(가로 스크롤). 오늘 포함 전체 기간을 한눈에 훑어보는 용도.
    //   각 날짜의 03~21시 3시간 간격 데이터(rowsByDate)에서 기온 범위·최대 풍속/풍향·최대 파고를 뽑아 요약.
    function renderWeekBrief(dates, codes, rowsByDate) {
        const briefEl = document.getElementById('hf-week-brief');
        if (!briefEl) return;
        const todayStr = new Date().toISOString().slice(0, 10);

        let html = '';
        dates.forEach((d, i) => {
            const rows = rowsByDate[d];
            if (!rows || rows.length === 0) return;

            const dt = new Date(d + 'T00:00:00');
            const isToday = d === todayStr;
            const dateLabel = isToday ? '오늘' : `${dt.getMonth() + 1}/${dt.getDate()}(${['일','월','화','수','목','금','토'][dt.getDay()]})`;

            const temps = rows.map(r => r.airTemp).filter(v => v !== null && v !== undefined);
            const tempMin = temps.length ? Math.min(...temps) : null;
            const tempMax = temps.length ? Math.max(...temps) : null;

            // 풍속이 가장 센 시간대의 풍속·풍향을 대표값으로 사용
            let windRep = rows[0];
            rows.forEach(r => { if (r.wind > windRep.wind) windRep = r; });

            const waveMax = Math.max(...rows.map(r => r.wave ?? 0));

            html += `
                <div class="hf-week-chip${isToday ? ' is-today' : ''}">
                    <div class="hf-week-chip-date">${dateLabel}</div>
                    <div class="hf-week-chip-emoji">${weatherEmoji(codes[i])}</div>
                    <div class="hf-week-chip-temp">${tempMax !== null ? tempMax.toFixed(0) : '-'}° <span>/ ${tempMin !== null ? tempMin.toFixed(0) : '-'}°</span></div>
                    <div class="hf-week-chip-wind">${windRep.windDir !== null ? deg2dir8(windRep.windDir) : ''} ${windRep.wind.toFixed(1)}m/s</div>
                    <div class="hf-week-chip-wave">🌊 ${waveMax.toFixed(1)}m</div>
                </div>
            `;
        });

        briefEl.innerHTML = html;
        briefEl.style.display = html ? 'flex' : 'none';
    }

    // [수정] "오늘"은 위 시간별 예보와 중복이라 제외하고, 내일부터만 날짜별로 나열합니다.
    function renderDailyForecast(dates, codes, rowsByDate) {
        const todayStr = new Date().toISOString().slice(0, 10);
        let html = '';
        dates.forEach((d, i) => {
            if (d === todayStr) return; // [수정] 오늘은 시간별 예보와 중복이므로 제외
            const rows = rowsByDate[d];
            if (!rows || rows.length === 0) return;
            const dt = new Date(d + 'T00:00:00');
            const md = `${dt.getMonth() + 1}/${dt.getDate()}`;
            const dow = ['일', '월', '화', '수', '목', '금', '토'][dt.getDay()];

            let rowsHtml = '';
            rows.forEach(r => {
                rowsHtml += buildTableRowHtml(r.hour, r.wave, r.wind, r.windDir, r.waterTemp, r.code, r.airTemp, r.precip, r.waveDir, false);
            });

            html += `
                <div class="hf-day-group">
                    <div class="hf-day-heading">${md}(${dow}) ${weatherEmoji(codes[i])}</div>
                    <div class="hf-table-wrap">
                        <table class="hf-table">
                            <thead>
                                <tr>
                                    <th>시간</th><th>풍향/풍속</th><th>날씨/수온</th><th>파고</th><th>탁도</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                </div>
            `;
        });
        document.getElementById('hf-daily-list').innerHTML = html;
        document.getElementById('hf-daily-card').style.display = 'block';

        renderDailySummary(dates, rowsByDate);
    }

    // [신규] 내일·모레의 최대 파고/풍속을 보고 한 줄 요약 가이드를 생성
    function renderDailySummary(dates, rowsByDate) {
        const summaryEl = document.getElementById('hf-daily-summary');
        const todayStr = new Date().toISOString().slice(0, 10);
        const futureDates = dates.filter(d => d > todayStr).slice(0, 2); // 내일, 모레

        const stats = futureDates.map(d => {
            const rows = rowsByDate[d] || [];
            if (rows.length === 0) return null;
            return {
                maxWave: Math.max(...rows.map(r => r.wave)),
                maxWind: Math.max(...rows.map(r => r.wind))
            };
        });
        const [tomorrow, dayAfter] = stats;

        if (!tomorrow) { summaryEl.style.display = 'none'; return; }

        const isDanger = s => s && (s.maxWave >= 1.2 || s.maxWind >= 6.0);
        const isCaution = s => s && !isDanger(s) && (s.maxWave >= 0.7 || s.maxWind > 3.0);

        let text;
        if (isDanger(tomorrow) && isDanger(dayAfter)) {
            text = `💡 내일부터 모레까지 파고가 최대 ${tomorrow.maxWave.toFixed(1)}~${dayAfter.maxWave.toFixed(1)}m로 높아질 예정이에요. 바람도 강하니 입수에 주의하세요.`;
        } else if (isDanger(tomorrow)) {
            const windNote = tomorrow.maxWind >= 6.0 ? ' 바람도 세니 안전에 주의하세요.' : '';
            text = `💡 내일부터 파고가 최대 ${tomorrow.maxWave.toFixed(1)}m로 높아질 예정입니다.${windNote}`;
        } else if (isCaution(tomorrow) || isCaution(dayAfter)) {
            text = `💡 내일·모레 파고나 바람이 다소 있을 수 있어요. 초보자는 안전장비를 챙기고 주의하세요.`;
        } else {
            text = `💡 내일·모레 모두 편안한 바다가 예상됩니다.`;
        }

        summaryEl.innerText = text;
        summaryEl.style.display = 'block';
    }
</script>
</body>
</html>
