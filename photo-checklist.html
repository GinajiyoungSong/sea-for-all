<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 스팟 사진 체크리스트</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#0ea5e9;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--ink:#e5edf9;--mute:#94a3b8;--line:#22304a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
#app{display:flex;height:100vh;height:100dvh}
#side{width:380px;max-width:42vw;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);min-width:300px}
#head{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#head h1{font-size:16px;margin:0 0 8px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.progtxt{font-size:12px;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between}
#search{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;white-space:nowrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;font-size:12px;font-weight:700;border-radius:15px;border:1px solid var(--line);background:var(--bg);color:var(--mute);cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.sub{padding-bottom:8px}.chip.sub.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tools{display:flex;gap:6px;padding:0 14px 8px;font-size:12px;flex-wrap:wrap}
.tools button{padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:12px}
.tools label{display:flex;align-items:center;gap:4px;color:var(--mute);margin-left:auto}
#list{flex:1;overflow-y:auto}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.sel{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.item input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:0 0 auto}
.item .nm{font-size:14px;font-weight:700}
.item.done .nm{text-decoration:line-through;color:var(--mute)}
.item .meta{font-size:11px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;padding:0 6px;border-radius:8px;background:var(--line);margin-right:4px}
.item textarea{display:none}
#mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0;background:#111}
.pin{background:none;border:none}
.pin .dot{width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin.done .dot{background:#16a34a}
.pin .lbl{position:absolute;left:18px;top:-3px;white-space:nowrap;font-size:11px;font-weight:800;color:#1f2937;background:rgba(255,255,255,.94);padding:1px 7px;border-radius:9px;display:none;pointer-events:none}
#map.labels .pin .lbl{display:block}
.pin.sel .dot{width:20px;height:20px;margin:-3px;border-color:#fde047}
.cl{background:none;border:none}
.cl div{width:42px;height:42px;border-radius:50%;background:rgba(14,116,144,.93);color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.cl.done div{background:rgba(22,163,74,.93)}
#toggle{display:none}
@media (max-width:760px){
 #app{flex-direction:column-reverse}
 #side{width:100%;max-width:none;height:48%;min-width:0;border-right:none;border-top:1px solid var(--line)}
 #mapwrap{height:52%;flex:none}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side">
  <div id="head">
   <h1>📸 제주 스팟 사진 체크리스트</h1>
   <div class="prog"><i id="pbar"></i></div>
   <div class="progtxt"><span id="ptxt"></span><span id="pshown"></span></div>
   <input id="search" type="search" placeholder="장소 이름·지역 검색">
  </div>
  <div class="chips" id="cats"></div>
  <div class="chips sub" id="types"></div>
  <div class="tools">
   <button id="bUndone">미완료만</button>
   <button id="bExport">완료 목록 저장</button>
   <button id="bImport">불러오기</button>
   <button id="bReset">초기화</button>
   <label><input type="checkbox" id="cLabels" checked>이름</label>
  </div>
  <div id="list"></div>
 </aside>
 <div id="mapwrap"><div id="map"></div></div>
</div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  n=(n||'').trim(); if(!n) return;
  let p=byName.get(n);
  if(!p){p={name:n,region:rg,lat:la,lng:lo,info:inf,desc:de,cats:new Set(),pairs:new Set()};byName.set(n,p)}
  const c=ck(d); p.cats.add(c); p.pairs.add(c+'||'+t);
});
const places=[...byName.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko'));

/* 완료 상태 저장 (브라우저 localStorage, 실패해도 동작) */
const KEY='jeju-photo-checklist-v1';
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};

let selCat='__all',selType='__all',onlyUndone=false,q='',selName=null;

/* 지도: 구글 위성지도만 */
const map=L.map('map',{zoomControl:true}).setView([33.3798,126.5312],10);
L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20,attribution:'© Google Map Satellite'}).addTo(map);
const cluster=L.markerClusterGroup({maxClusterRadius:50,disableClusteringAtZoom:14,showCoverageOnHover:false,
  iconCreateFunction:c=>{const ms=c.getAllChildMarkers();const all=ms.every(m=>done.has(m._pl.name));
   return L.divIcon({html:`<div>${ms.length}</div>`,className:'cl'+(all?' done':''),iconSize:[42,42]})}});
map.addLayer(cluster);

function icon(p){return L.divIcon({className:'pin'+(done.has(p.name)?' done':'')+(selName===p.name?' sel':''),
  html:`<div class="dot"></div><div class="lbl">${esc(p.name)}</div>`,iconSize:[14,14],iconAnchor:[7,7]})}
places.forEach(p=>{p.marker=L.marker([p.lat,p.lng],{icon:icon(p)});p.marker._pl=p;
  p.marker.on('click',()=>{select(p.name,false);document.querySelector('.item.sel')?.scrollIntoView({block:'center'})})});

function match(p){
  if(onlyUndone&&done.has(p.name))return false;
  if(q&&!(p.name+' '+(p.region||'')).toLowerCase().includes(q))return false;
  for(const pr of p.pairs){const [c,t]=pr.split('||');
    if((selCat==='__all'||c===selCat)&&(selType==='__all'||t===selType))return true}
  return false;
}
function renderChips(){
  const cb=document.getElementById('cats');cb.innerHTML='';
  [{k:'__all',l:'전체'},...CATS].forEach(c=>{
    const n=places.filter(p=>c.k==='__all'||p.cats.has(c.k)).length; if(!n&&c.k!=='__all')return;
    const e=document.createElement('div');e.className='chip'+(selCat===c.k?' on':'');e.textContent=`${c.l} ${n}`;
    e.onclick=()=>{selCat=c.k;selType='__all';refresh()};cb.appendChild(e)});
  const tc=new Map();
  places.forEach(p=>p.pairs.forEach(pr=>{const [c,t]=pr.split('||');if(selCat==='__all'||c===selCat){(tc.get(t)||tc.set(t,new Set()).get(t)).add(p.name)}}));
  const tb=document.getElementById('types');tb.innerHTML='';
  const a=document.createElement('div');a.className='chip sub'+(selType==='__all'?' on':'');a.textContent='모든 유형';a.onclick=()=>{selType='__all';refresh()};tb.appendChild(a);
  [...tc.entries()].sort((x,y)=>y[1].size-x[1].size).forEach(([t,s])=>{
    const e=document.createElement('div');e.className='chip sub'+(selType===t?' on':'');e.textContent=`${tl(t)} ${s.size}`;
    e.onclick=()=>{selType=t;refresh()};tb.appendChild(e)});
}
function renderList(vis){
  const L=document.getElementById('list');L.innerHTML='';
  vis.forEach(p=>{
    const d=document.createElement('div');d.className='item'+(done.has(p.name)?' done':'')+(selName===p.name?' sel':'');
    const catTags=CATS.filter(c=>p.cats.has(c.k)).map(c=>`<span class="tag">${c.l}</span>`).join('');
    d.innerHTML=`<input type="checkbox" ${done.has(p.name)?'checked':''}><div><div class="nm">${esc(p.name)}</div><div class="meta">${catTags}${esc(p.region||'')}</div></div>`;
    d.querySelector('input').onclick=e=>{e.stopPropagation();toggle(p.name)};
    d.onclick=()=>select(p.name,true);
    L.appendChild(d)});
}
function toggle(n){done.has(n)?done.delete(n):done.add(n);save();refresh(true)}
function select(n,fly){selName=n;const p=byName.get(n);
  if(fly){map.setView([p.lat,p.lng],Math.max(map.getZoom(),15),{animate:true})}
  refresh(true)}
function updLabels(){document.getElementById('map').classList.toggle('labels',document.getElementById('cLabels').checked&&(map.getZoom()>=13))}
function refresh(keepScroll){
  const vis=places.filter(match);
  const st=document.getElementById('list').scrollTop;
  renderChips();renderList(vis);
  if(keepScroll)document.getElementById('list').scrollTop=st;
  cluster.clearLayers();
  vis.forEach(p=>{p.marker.setIcon(icon(p));cluster.addLayer(p.marker)});
  const total=places.length,dn=places.filter(p=>done.has(p.name)).length;
  document.getElementById('pbar').style.width=(dn/total*100)+'%';
  document.getElementById('ptxt').textContent=`완료 ${dn} / ${total}`;
  document.getElementById('pshown').textContent=`목록 ${vis.length}개`;
  document.getElementById('bUndone').style.background=onlyUndone?'var(--acc)':'';
  document.getElementById('bUndone').style.color=onlyUndone?'#fff':'';
  updLabels();
}
document.getElementById('search').oninput=e=>{q=e.target.value.trim().toLowerCase();refresh()};
document.getElementById('bUndone').onclick=()=>{onlyUndone=!onlyUndone;refresh()};
document.getElementById('cLabels').onchange=updLabels;
map.on('zoomend',updLabels);
document.getElementById('bReset').onclick=()=>{if(confirm('모든 체크를 해제할까요?')){done.clear();save();refresh()}};
document.getElementById('bExport').onclick=()=>{
  const blob=new Blob([JSON.stringify([...done],null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='photo-checklist-done.json';a.click()};
document.getElementById('bImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{done=new Set(JSON.parse(t));save();refresh()}catch(x){alert('불러오기 실패')}})};
refresh();
</script>
</body>
</html>
